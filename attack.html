<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attacker stories and ATT&amp;CK coverage</title>
<!-- P13 (2026-11-24). Served by digest-viewer (CT 111, /srv/digest/www). Data:
     attack.json          pushed hourly by attack-stories on CT 107 (symlink to /srv/digest/incoming/attack.json)
     attack-coverage.json generated by attack_layer.py on the Wazuh manager (CT 100), copied here by hand
     attack-layer.json    the same coverage as an ATT&CK Navigator layer, for download
     ?embed=1 shows only the summary tiles and the timeline (Homepage iframe). -->
<style>
  html { scrollbar-color: rgba(149,214,0,.45) #141414; scrollbar-width: thin; }
  :root { --fg: #f5f5f5; --muted: #a3a3a3; --faint: #6b6b6b; --line: rgba(255,255,255,.10); --accent: #95d600;
          --card: rgba(255,255,255,.04); --s1: #3987e5; --s2: #d95926; --s3: #199e70;
          --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; }
  html, body { margin: 0; background: transparent; color: var(--fg);
               font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px 32px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 28px 0 10px; font-weight: 600; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
          color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
  .tile:hover { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.06); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile[aria-expanded="true"] { border-color: var(--accent); background: rgba(149,214,0,.07); }
  .tile .l .hint { margin-left: auto; color: var(--faint); font-size: 11px; }
  .drill { margin-top: 10px; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
  .drill-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .drill-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .drill select { background: #1f1f1f; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
                  font: inherit; font-size: 13px; max-width: 100%; min-width: 280px; }
  .drill .x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  .kc { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 6px 0 10px; }
  .kc-node { flex: 0 0 auto; min-width: 170px; max-width: 240px; background: rgba(255,255,255,.035); border: 1px solid var(--line);
             border-top: 3px solid var(--accent); border-radius: 6px; padding: 8px; }
  .kc-node h4 { margin: 0 0 2px; font-size: 12px; font-weight: 600; }
  .kc-node .when { color: var(--faint); font-size: 11px; margin-bottom: 6px; }
  .kc-arrow { flex: 0 0 26px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; }
  .tech { border-left: 3px solid var(--faint); background: rgba(255,255,255,.04); border-radius: 3px; padding: 4px 6px; margin-bottom: 4px;
          font-size: 12px; line-height: 1.3; }
  .tech .tid { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); }
  .tech .meta { color: var(--faint); font-size: 11px; }
  .nav { display: grid; grid-template-columns: repeat(14, minmax(64px, 1fr)); gap: 3px; overflow-x: auto; margin-top: 4px; }
  .nav div { font-size: 10px; line-height: 1.25; border-radius: 3px; padding: 3px 4px; min-height: 34px; }
  .nav .off { background: rgba(255,255,255,.03); color: var(--faint); }
  .nav .on { color: #fff; }
  .sub { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  button.btn { background: rgba(149,214,0,.12); border: 1px solid rgba(149,214,0,.45); color: var(--accent); border-radius: 6px;
               padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .tile .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .tile .l { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .chartwrap { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  svg text { fill: var(--muted); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: #222220; border: 1px solid var(--line); border-radius: 6px;
         padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .tip b { font-weight: 600; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .story { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .story .top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px 1px 6px;
         border-radius: 999px; border: 1px solid currentColor; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .chip { background: rgba(255,255,255,.07); border-radius: 4px; padding: 1px 6px; }
  .arrow { color: var(--faint); }
  .ents { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); word-break: break-all; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-top: 6px; }
  .matrix { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .col h3 { font-size: 12px; font-weight: 600; margin: 0 0 4px; text-transform: capitalize; }
  .col .cnt { color: var(--muted); font-weight: 400; }
  .cell { border-radius: 4px; padding: 4px 6px; margin-bottom: 3px; font-size: 11px; line-height: 1.3; cursor: default; color: #fff; }
  .cell .id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; opacity: .85; }
  .cell.empty { background: transparent; border: 1px dashed var(--line); color: var(--faint); }
  .ramp { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .ramp i { width: 18px; height: 10px; display: inline-block; border-radius: 2px; }
  .err { color: var(--serious); }
  body.embed h2.full, body.embed .full { display: none; }
</style>
</head>
<body>
<header>
  <h1>Attacker stories <span class="muted full">and ATT&amp;CK coverage</span></h1>
  <span class="muted" id="updated">loading…</span>
</header>

<div class="tiles" id="tiles" role="group" aria-label="Story categories"></div>
<div class="drill" id="drill" hidden></div>

<h2>Timeline <span class="muted" style="font-weight:400">· last 7 days, events per hour</span></h2>
<div class="chartwrap" id="tlwrap">
  <div class="legend" id="tllegend"></div>
  <svg id="tl" width="100%" height="190" role="img" aria-label="Hourly events, last 7 days"></svg>
  <div class="tip" id="tip"></div>
  <div style="margin-top:6px"><button class="link" id="tltablebtn">Show as table</button></div>
  <div id="tltable" style="display:none;max-height:240px;overflow:auto;margin-top:6px"></div>
</div>

<h2 class="full">Current stories <span class="muted" style="font-weight:400" id="storyhint"></span></h2>
<div class="full" id="stories"></div>

<h2 class="full">Detection coverage <span class="muted" style="font-weight:400" id="covhint"></span></h2>
<div class="full">
  <div style="display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:8px">
    <span class="ramp" id="ramp"></span>
    <a href="attack-layer.json" download style="color:var(--accent);font-size:12px">Download ATT&amp;CK Navigator layer</a>
    <span class="faint" style="font-size:12px">then mitre-attack.github.io/attack-navigator → Open Existing Layer → Upload from local</span>
  </div>
  <div class="matrix" id="matrix"></div>
  <div class="faint" style="font-size:12px;margin-top:6px" id="covfoot"></div>
</div>

<script>
const EMBED = new URLSearchParams(location.search).has("embed");
if (window.self === window.top) document.documentElement.style.background = "#141414";  // standalone: dark page; in Homepage's iframe: transparent
if (EMBED) document.body.classList.add("embed");
const SEV = { critical: ["var(--crit)", "▲"], high: ["var(--serious)", "◆"], medium: ["var(--warn)", "●"], low: ["var(--muted)", "○"] };
const SERIES = [
  ["wazuh", "Wazuh alerts with ATT&CK IDs", "var(--s1)"],
  ["engine-active", "Anomaly engine, active", "var(--s2)"],
  ["engine-learn", "Anomaly engine, burn-in", "var(--s3)"],
];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const titleCase = s => s.replace(/-/g, " ");

async function getJSON(u) { const r = await fetch(u + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(u + ": " + r.status); return r.json(); }

function tiles(d) {
  const c = { critical: 0, high: 0, medium: 0, low: 0 };
  d.stories.forEach(s => c[s.severity] = (c[s.severity] || 0) + 1);
  const tot = (d.series.wazuh || []).slice(-24).reduce((a, b) => a + b, 0);
  let h = "";
  for (const k of ["critical", "high", "medium", "low"]) {
    h += `<button class="tile" data-cat="${k}" aria-expanded="${OPEN === k}" aria-controls="drill">
      <div class="n">${c[k]}</div><div class="l"><span style="color:${SEV[k][0]}">${SEV[k][1]}</span>${k} stories<span class="hint">▾</span></div></button>`;
  }
  h += `<button class="tile" data-cat="alerts" aria-expanded="${OPEN === "alerts"}" aria-controls="drill">
    <div class="n">${tot}</div><div class="l">ATT&amp;CK alerts, 24 h<span class="hint">▾</span></div></button>`;
  const el = document.getElementById("tiles");
  el.innerHTML = h;
  el.querySelectorAll(".tile").forEach(b => b.onclick = () => openCat(OPEN === b.dataset.cat ? null : b.dataset.cat));
}

// ---------------------------------------------------------------- drill-down: category -> incident -> ATT&CK chain
const TACTIC_ORDER = ["Reconnaissance", "Resource Development", "Initial Access", "Execution", "Persistence",
  "Privilege Escalation", "Defense Evasion", "Credential Access", "Discovery", "Lateral Movement", "Collection",
  "Command and Control", "Exfiltration", "Impact"];
const NAV_SHORT = { "Resource Development": "Resource Dev.", "Privilege Escalation": "Privilege Esc.", "Command and Control": "C2",
  "Lateral Movement": "Lateral Mov.", "Credential Access": "Credential Acc." };
let DATA = null, OPEN = null, PICK = null, TECHS = null;
const lvlColor = l => l >= 12 ? "var(--crit)" : l >= 10 ? "var(--serious)" : l >= 7 ? "var(--warn)" : "var(--faint)";
const SEVCOL = { critical: "#d03b3b", high: "#ec835a", medium: "#fab219", low: "#8a8a8a" };
async function techNames() {
  if (TECHS) return TECHS;
  try { TECHS = await getJSON("attack-techniques.json"); } catch (e) { TECHS = {}; }
  return TECHS;
}
function tacticsOf(id, fallback) {
  const m = TECHS && (TECHS[id] || TECHS[id.split(".")[0]]);
  return (m && m.t && m.t.length) ? m.t : (fallback || []);
}
const nameOf = (id, fb) => (TECHS && TECHS[id] && TECHS[id].n) || fb || "";
const shortTime = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };

function itemsFor(cat) {
  if (!DATA) return [];
  if (cat === "alerts") return (DATA.alert_groups || []).map(g => ({ kind: "alert", key: "r" + g.rule, g }));
  return DATA.stories.filter(s => s.severity === cat).map(s => ({ kind: "story", key: s.id, s }));
}
function labelFor(it) {
  if (it.kind === "alert") { const g = it.g; return `L${g.level} · rule ${g.rule} · ${g.desc.slice(0, 70)} (${g.count}×)`; }
  const s = it.s, ents = (s.entities || []).slice(0, 2).join(", ");
  return `${s.id} · ${(s.tactics || []).join(" → ") || "no tactic"} · ${s.events} events · ${ents}${s.all_blocked ? " · all blocked" : ""}`;
}

async function openCat(cat, pickKey) {
  OPEN = cat; PICK = pickKey || null;
  document.querySelectorAll(".tile").forEach(b => b.setAttribute("aria-expanded", String(b.dataset.cat === cat)));
  const box = document.getElementById("drill");
  if (!cat) { box.hidden = true; box.innerHTML = ""; return; }
  await techNames();
  const items = itemsFor(cat);
  const title = cat === "alerts" ? "ATT&CK alerts, last 24 h, by rule" : `${cat[0].toUpperCase() + cat.slice(1)} stories`;
  let picker;
  if (!items.length) picker = `<span class="muted">Nothing in this category right now.</span>`;
  else if (items.length === 1) { PICK = items[0].key; picker = `<span class="muted">${esc(labelFor(items[0]))}</span>`; }
  else picker = `<select id="pick" aria-label="Select an incident"><option value="">Select one of ${items.length}…</option>` +
    items.map(it => `<option value="${esc(it.key)}"${it.key === PICK ? " selected" : ""}>${esc(labelFor(it))}</option>`).join("") + `</select>`;
  box.innerHTML = `<div class="drill-head"><h3>${esc(title)}</h3>${picker}
      ${EMBED ? `<a href="attack.html?cat=${cat}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px">open full view ↗</a>` : ""}
      <button class="x" title="Close" aria-label="Close">×</button></div><div id="diagram"></div>`;
  box.hidden = false;
  box.querySelector(".x").onclick = () => openCat(null);
  const sel = box.querySelector("#pick");
  if (sel) sel.onchange = () => { PICK = sel.value || null; drawPick(items); };
  drawPick(items);
}

function drawPick(items) {
  const el = document.getElementById("diagram");
  const it = items.find(i => i.key === PICK);
  if (!it) { el.innerHTML = ""; return; }
  el.innerHTML = it.kind === "story" ? storyDiagram(it.s) : alertDiagram(it.g);
  const dl = el.querySelector("[data-layer]");
  if (dl) dl.onclick = () => downloadLayer(it);
  el.querySelectorAll("[data-goto]").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const s = DATA.stories.find(x => x.id === a.dataset.goto);
    if (s) openCat(s.severity, s.id);
  });
}

// techniques -> tactic columns, ordered along the kill chain. A technique that ATT&CK lists under several tactics
// (T1078 Valid Accounts sits in four) goes in one column only, its earliest kill-chain tactic that the alert itself
// claimed; the others are noted on the card instead of repeating it in every column.
function primaryTactic(t) {
  const off = tacticsOf(t.id, t.tactics), own = t.tactics || [];
  const both = off.filter(x => own.includes(x));
  const pick = (both.length ? both : off.length ? off : own).slice().sort((a, b) => TACTIC_ORDER.indexOf(a) - TACTIC_ORDER.indexOf(b))[0];
  return { tac: pick || "(no tactic)", also: off.filter(x => x !== pick) };
}
function chainOf(techs) {
  const cols = {};
  techs.forEach(t => { const p = primaryTactic(t); (cols[p.tac] = cols[p.tac] || []).push({ ...t, also: p.also }); });
  const order = [...TACTIC_ORDER, "(no tactic)"].filter(t => cols[t]);
  return order.map(tac => ({ tac, techs: cols[tac], first: cols[tac].map(t => t.first).filter(Boolean).sort()[0] }));
}
function chainHTML(chain, sevColor) {
  if (!chain.length) return `<div class="muted">No ATT&amp;CK techniques on these events.</div>`;
  const seq = chain.map(c => c.first).filter(Boolean).sort();
  return `<div class="kc" role="list" aria-label="ATT&amp;CK chain">` + chain.map((c, i) => {
    const step = c.first ? seq.indexOf(c.first) + 1 : "";
    return (i ? `<div class="kc-arrow" aria-hidden="true">→</div>` : "") +
      `<div class="kc-node" role="listitem" style="border-top-color:${sevColor}">
        <h4>${esc(c.tac)}</h4><div class="when">${c.first ? `first seen ${esc(shortTime(c.first))}${seq.length > 1 ? ` · #${step} in time` : ""}` : ""}</div>` +
      c.techs.map(t => `<div class="tech" style="border-left-color:${lvlColor(t.max_level)}">
          <span class="tid">${esc(t.id)}</span> ${esc(nameOf(t.id, t.name))}
          <div class="meta">${t.events} event${t.events === 1 ? "" : "s"} · max L${t.max_level}${t.rules && t.rules.length ? ` · rule ${esc(t.rules.slice(0, 3).join(", "))}` : ""}</div>
          ${t.also && t.also.length ? `<div class="meta">also ${esc(t.also.map(x => NAV_SHORT[x] || x).join(", "))}</div>` : ""}</div>`).join("") +
      `</div>`;
  }).join("") + `</div>`;
}
// compact Navigator-style strip: all 14 tactics, this incident's techniques lit
function navHTML(techs, color) {
  const by = {}, also = {};
  techs.forEach(t => { const p = primaryTactic(t); (by[p.tac] = by[p.tac] || []).push(t); p.also.forEach(a => (also[a] = also[a] || []).push(t)); });
  return `<div class="nav" aria-label="ATT&amp;CK matrix position">` + TACTIC_ORDER.map(tac => {
    const hit = by[tac], soft = !hit && also[tac];
    const list = hit || soft;
    return `<div class="${list ? "on" : "off"}" style="${hit ? `background:${color}` : soft ? `background:${color}33;color:var(--muted)` : ""}"
      title="${esc(tac)}${list ? ": " + esc(list.map(t => t.id).join(", ")) + (soft ? " (also in this tactic)" : "") : ""}">
      <b>${esc(NAV_SHORT[tac] || tac)}</b>${list ? "<br>" + list.map(t => esc(t.id)).join("<br>") : ""}</div>`;
  }).join("") + `</div>`;
}
function timelineSVG(events) {
  const ev = events.filter(e => e.ts).map(e => ({ ...e, t: Date.parse(e.ts) })).sort((a, b) => a.t - b.t);
  if (!ev.length) return "";
  const lanes = [];
  ev.forEach(e => { e.lane = primaryTactic({ id: (e.techniques || [])[0] || "", tactics: e.tactics }).tac; if (!lanes.includes(e.lane)) lanes.push(e.lane); });
  lanes.sort((a, b) => TACTIC_ORDER.indexOf(a) - TACTIC_ORDER.indexOf(b));
  const W = Math.max(480, (document.getElementById("drill").clientWidth || 900) - 50), padL = 120, padR = 16, laneH = 22, H = lanes.length * laneH + 30;
  const t0 = ev[0].t, t1 = Math.max(ev[ev.length - 1].t, t0 + 60000);
  const x = t => padL + (W - padL - padR) * (t - t0) / (t1 - t0);
  const srcCol = { wazuh: "var(--s1)", "engine-active": "var(--s2)", "engine-learn": "var(--s3)" };
  let g = lanes.map((l, i) => `<text x="${padL - 8}" y="${i * laneH + 15}" text-anchor="end">${esc(NAV_SHORT[l] || l)}</text>
    <line x1="${padL}" x2="${W - padR}" y1="${i * laneH + 11}" y2="${i * laneH + 11}" stroke="rgba(255,255,255,.07)"/>`).join("");
  // connect events in time order: the path the incident took
  const pts = ev.map(e => `${x(e.t).toFixed(1)},${lanes.indexOf(e.lane) * laneH + 11}`);
  if (pts.length > 1) g += `<polyline points="${pts.join(" ")}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>`;
  g += ev.map(e => `<circle cx="${x(e.t).toFixed(1)}" cy="${lanes.indexOf(e.lane) * laneH + 11}" r="5" fill="${srcCol[e.src] || "var(--muted)"}"
      stroke="#1b1b1b" stroke-width="2"><title>${esc(shortTime(e.ts))} · ${esc(e.src)} · rule ${esc(e.rule)} · L${e.level}\n${esc(e.desc)}</title></circle>`).join("");
  g += `<text x="${padL}" y="${H - 4}">${esc(shortTime(ev[0].ts))}</text><text x="${W - padR}" y="${H - 4}" text-anchor="end">${esc(shortTime(ev[ev.length - 1].ts))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Events over time by tactic">${g}</svg>`;
}
function storyDiagram(s) {
  const [c, ic] = SEV[s.severity] || SEV.low;
  const techs = (s.tech_detail && s.tech_detail.length) ? s.tech_detail : (s.techniques || []).map(id => {
    const ev = (s.timeline || []).filter(e => (e.techniques || []).includes(id));
    return { id, events: ev.length, max_level: Math.max(0, ...ev.map(e => e.level)), first: ev.length ? ev[0].ts : s.first, rules: [...new Set(ev.map(e => e.rule))], tactics: [] };
  });
  const learnOnly = (s.sources || []).length === 1 && s.sources[0] === "engine-learn";
  const rows = (s.timeline || []).slice().reverse().map(e => `<tr><td>${fmtTime(e.ts)}</td><td>${esc(e.src)}</td><td>${esc(e.rule)}</td>
      <td class="num">${e.level}</td><td>${esc(e.desc)}</td><td>${esc((e.techniques || []).join(", "))}</td></tr>`).join("");
  return `<div class="story" style="margin-top:10px"><div class="top">
      <span class="sev" style="color:${c}">${ic} ${s.severity}</span><b style="font-family:ui-monospace,Consolas,monospace">${esc(s.id)}</b>
      <span class="muted">${s.events} events · max level ${s.max_level} · ${fmtTime(s.first)} → ${fmtTime(s.last)}</span>
      ${learnOnly ? '<span class="chip faint">engine burn-in only</span>' : ""}${s.all_blocked ? '<span class="chip" style="color:var(--good)">all attempts blocked</span>' : ""}
      <button class="btn" data-layer style="margin-left:auto">Download Navigator layer</button></div>
    <div class="ents" style="margin-top:4px">${esc((s.entities || []).join("  "))}</div>
    <div class="sub">ATT&amp;CK chain</div>${chainHTML(chainOf(techs), SEVCOL[s.severity])}
    <div class="sub">Position in the ATT&amp;CK matrix</div>${navHTML(techs, SEVCOL[s.severity])}
    <div class="sub">Events over time</div>${timelineSVG(s.timeline || [])}
    <details><summary>Event list (${(s.timeline || []).length} most recent)</summary>
      <table><tr><th>Time</th><th>Source</th><th>Rule</th><th class="num">Lvl</th><th>Description</th><th>ATT&amp;CK</th></tr>${rows}</table></details>
  </div>`;
}
function alertDiagram(g) {
  const techs = (g.techniques || []).map(id => ({ id, name: (g.tnames || {})[id], events: g.count, max_level: g.level, first: g.first,
    rules: [g.rule], tactics: g.tactics }));
  const col = g.level >= 12 ? SEVCOL.critical : g.level >= 10 ? SEVCOL.high : g.level >= 7 ? SEVCOL.medium : SEVCOL.low;
  const st = (g.stories || []).map(id => `<a href="#" data-goto="${esc(id)}" style="color:var(--accent)">${esc(id)}</a>`).join(", ");
  return `<div class="story" style="margin-top:10px"><div class="top">
      <span class="sev" style="color:${col}">L${g.level}</span><b>rule ${esc(g.rule)}</b><span>${esc(g.desc)}</span>
      <span class="muted">${g.count}× · ${fmtTime(g.first)} → ${fmtTime(g.last)}</span>
      <button class="btn" data-layer style="margin-left:auto">Download Navigator layer</button></div>
    <div class="ents" style="margin-top:4px">${esc((g.entities || []).join("  "))}</div>
    <div class="muted" style="font-size:12px;margin-top:4px">${st ? `Part of stor${g.stories.length > 1 ? "ies" : "y"} ${st}` : "Not part of any current story."}</div>
    <div class="sub">ATT&amp;CK chain</div>${chainHTML(chainOf(techs), col)}
    <div class="sub">Position in the ATT&amp;CK matrix</div>${navHTML(techs, col)}
    <div class="sub">Occurrences</div>${timelineSVG((g.sample || []).map(x => ({ ts: x.ts, src: "wazuh", rule: g.rule, level: g.level, desc: (x.entities || []).join(" "), techniques: g.techniques, tactics: g.tactics })))}
  </div>`;
}
// a Navigator layer (v4.5) for just this incident: score = max level, comment = events and rules
function downloadLayer(it) {
  const isStory = it.kind === "story", s = it.s, g = it.g;
  const techs = isStory ? ((s.tech_detail && s.tech_detail.length) ? s.tech_detail : (s.techniques || []).map(id => ({ id, events: 1, max_level: s.max_level, rules: [], tactics: [] }))) : (g.techniques || []).map(id => ({ id, events: g.count, max_level: g.level, rules: [g.rule], tactics: g.tactics }));
  const slug = t => t.toLowerCase().replace(/ /g, "-");
  const entries = [];
  techs.forEach(t => tacticsOf(t.id, t.tactics).forEach(tac => entries.push({
    techniqueID: t.id, tactic: slug(tac), score: t.max_level, color: t.max_level >= 12 ? "#d03b3b" : t.max_level >= 10 ? "#ec835a" : t.max_level >= 7 ? "#fab219" : "#8ec8f6",
    comment: `${t.events} event(s), max level ${t.max_level}, rules ${(t.rules || []).join(", ")}`, enabled: true, showSubtechniques: true })));
  const name = isStory ? `story ${s.id} (${s.severity})` : `rule ${g.rule}`;
  const layer = { name: `homelab ${name}`, versions: { layer: "4.5", navigator: "5.1.0" }, domain: "enterprise-attack",
    description: isStory ? `${s.events} events ${s.first} to ${s.last}; entities ${(s.entities || []).join(", ")}` : g.desc,
    techniques: entries, gradient: { colors: ["#8ec8f6", "#fab219", "#d03b3b"], minValue: 0, maxValue: 15 },
    layout: { layout: "side", showName: true, showID: true, expandedSubtechniques: "annotated" }, hideDisabled: false };
  const blob = new Blob([JSON.stringify(layer, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `attack-layer-${isStory ? s.id : "rule-" + g.rule}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function timeline(d) {
  const svg = document.getElementById("tl"), wrap = document.getElementById("tlwrap"), tip = document.getElementById("tip");
  const hours = d.hours || [];
  document.getElementById("tllegend").innerHTML = SERIES.map(([k, l, c]) => `<span><i class="sw" style="background:${c}"></i>${l}</span>`).join("");
  if (!hours.length) { svg.outerHTML = '<div class="muted">No timeline data yet.</div>'; return; }
  const W = svg.clientWidth || 800, H = 190, padL = 34, padR = 6, padT = 8, padB = 22;
  const n = hours.length, bw = (W - padL - padR) / n;
  const totals = hours.map((_, i) => SERIES.reduce((a, [k]) => a + ((d.series[k] || [])[i] || 0), 0));
  const max = Math.max(1, ...totals);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return max; })();
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  let g = "";
  for (let t = 0; t <= 4; t++) {
    const v = nice * t / 4, yy = y(v);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,${t ? .06 : .18})"/>`;
    g += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  hours.forEach((h, i) => {
    const dt = new Date(h);
    if (dt.getHours() === 0) {
      const x = padL + i * bw;
      g += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${H - padB}" stroke="rgba(255,255,255,.05)"/>`;
      g += `<text x="${x + 3}" y="${H - 6}">${dt.toLocaleDateString([], { weekday: "short", day: "numeric" })}</text>`;
    }
    let acc = 0;
    const gap = bw > 4 ? 1 : 0;
    SERIES.forEach(([k, , c], si) => {
      const v = (d.series[k] || [])[i] || 0;
      if (!v) return;
      const y0 = y(acc), y1 = y(acc + v); acc += v;
      const top = SERIES.slice(si + 1).every(([k2]) => !((d.series[k2] || [])[i]));
      const hgt = Math.max(1, y0 - y1 - (top ? 0 : 1));
      g += `<rect x="${padL + i * bw + gap / 2}" y="${y1}" width="${Math.max(1, bw - gap)}" height="${hgt}" fill="${c}" rx="${top && bw > 5 ? 2 : 0}"/>`;
    });
    g += `<rect class="hit" data-i="${i}" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = g;
  svg.querySelectorAll("rect.hit").forEach(r => {
    r.addEventListener("mousemove", ev => {
      const i = +r.dataset.i, bx = wrap.getBoundingClientRect();
      tip.innerHTML = `<b>${fmtTime(hours[i])}</b><br>` + SERIES.map(([k, l, c]) =>
        `<span class="sw" style="background:${c}"></span> ${l}: <b>${(d.series[k] || [])[i] || 0}</b>`).join("<br>");
      tip.style.display = "block";
      let x = ev.clientX - bx.left + 12; if (x + tip.offsetWidth > bx.width) x = ev.clientX - bx.left - tip.offsetWidth - 12;
      tip.style.left = x + "px"; tip.style.top = (ev.clientY - bx.top + 12) + "px";
      r.setAttribute("fill", "rgba(255,255,255,.06)");
    });
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; r.setAttribute("fill", "transparent"); });
  });
  // table view
  const rows = hours.map((h, i) => [h, ...SERIES.map(([k]) => (d.series[k] || [])[i] || 0)]).filter(r => r.slice(1).some(v => v)).reverse();
  document.getElementById("tltable").innerHTML = `<table><tr><th>Hour</th>${SERIES.map(s => `<th class="num">${s[1]}</th>`).join("")}</tr>` +
    rows.map(r => `<tr><td>${fmtTime(r[0])}</td>${r.slice(1).map(v => `<td class="num">${v}</td>`).join("")}</tr>`).join("") + "</table>";
}
document.getElementById("tltablebtn").onclick = e => {
  const t = document.getElementById("tltable"), on = t.style.display === "none";
  t.style.display = on ? "block" : "none"; e.target.textContent = on ? "Hide table" : "Show as table";
};

function stories(d) {
  const el = document.getElementById("stories");
  document.getElementById("storyhint").textContent = `· ${d.stories.length} in the last ${d.window_hours} h, worst first`;
  if (!d.stories.length) { el.innerHTML = '<div class="muted">No stories in the window.</div>'; return; }
  el.innerHTML = d.stories.map(s => {
    const [c, ic] = SEV[s.severity] || SEV.low;
    const learnOnly = (s.sources || []).length === 1 && s.sources[0] === "engine-learn";
    const chain = (s.tactics || []).map(t => `<span class="chip">${esc(t)}</span>`).join('<span class="arrow">→</span>') || '<span class="faint">no tactic</span>';
    const tl = (s.timeline || []).slice().reverse().map(e => `<tr><td>${fmtTime(e.ts)}</td><td>${esc(e.src)}</td><td>${esc(e.rule)}</td>
      <td class="num">${e.level}</td><td>${esc(e.desc)}</td><td>${esc((e.techniques || []).join(", "))}</td></tr>`).join("");
    return `<div class="story"><div class="top">
        <span class="sev" style="color:${c}">${ic} ${s.severity}</span>
        <b style="font-family:ui-monospace,Consolas,monospace">${esc(s.id)}</b>
        <span class="muted">${s.events} events · max level ${s.max_level} · ${fmtTime(s.first)} → ${fmtTime(s.last)}</span>
        ${learnOnly ? '<span class="chip faint">engine burn-in only</span>' : ""}${s.all_blocked ? '<span class="chip" style="color:var(--good)">all attempts blocked</span>' : ""}${s.new ? '<span class="chip" style="color:var(--accent)">new or grown</span>' : ""}
        <a href="#" class="link" data-goto="${esc(s.id)}" style="margin-left:auto;color:var(--accent);font-size:12px">ATT&amp;CK chain ▸</a>
      </div>
      <div class="chain" style="margin-top:6px">${chain}</div>
      <div class="ents" style="margin-top:4px">${esc((s.entities || []).join("  "))}</div>
      <details><summary>Timeline (${(s.timeline || []).length} most recent)</summary>
        <table><tr><th>Time</th><th>Source</th><th>Rule</th><th class="num">Lvl</th><th>Description</th><th>ATT&amp;CK</th></tr>${tl}</table></details>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-goto]").forEach(a => a.onclick = ev => {
    ev.preventDefault(); const s = DATA.stories.find(x => x.id === a.dataset.goto);
    if (s) { openCat(s.severity, s.id); document.getElementById("tiles").scrollIntoView({ behavior: "smooth" }); }
  });
}

// sequential blue ramp (reference palette), step by rule count
const RAMP = [[1, "#5598e7"], [2, "#3987e5"], [4, "#2a78d6"], [8, "#256abf"], [16, "#1c5cab"], [32, "#104281"]];
const shade = n => { let c = RAMP[0][1]; for (const [m, h] of RAMP) if (n >= m) c = h; return c; };
function coverage(cov) {
  document.getElementById("covhint").textContent = `· ${cov.rules} custom rules map to ${cov.techniques} techniques`;
  document.getElementById("ramp").innerHTML = "Rules per technique " + RAMP.map(([m, h], i) =>
    `<i style="background:${h}" title="${m}${i < RAMP.length - 1 ? "–" + (RAMP[i + 1][0] - 1) : "+"}"></i>`).join("") + " 1 → 32+";
  const cells = [];
  document.getElementById("matrix").innerHTML = cov.tactics.map(t => `<div class="col"><h3>${titleCase(t.tactic)} <span class="cnt">${t.techniques.length}</span></h3>` +
    (t.techniques.length ? t.techniques.map(x => `<div class="cell" style="background:${shade(x.rules)};color:${x.rules < 4 ? "#0b1a30" : "#fff"}" data-i="${cells.push(x) - 1}">
        <span class="id">${esc(x.id)}</span> ${esc(x.name)} <span style="opacity:.75">· ${x.rules}</span></div>`).join("")
      : '<div class="cell empty">no custom rules</div>') + "</div>").join("");
  document.querySelectorAll(".cell[data-i]").forEach(c => {
    c.title = (() => { const x = cells[+c.dataset.i]; return `${x.id} ${x.name}\n${x.rules} rules (${x.sources.join(", ")}), max level ${x.max_level}\n` + x.top.join("\n"); })();
  });
  document.getElementById("covfoot").textContent = `Sources: ${Object.entries(cov.sources).map(([k, v]) => `${k} ${v}`).join(" · ")}. ` +
    `Generated ${cov.generated}. Built-in Wazuh rules are not counted.` + (cov.unmapped.length ? ` No tactic in Wazuh's ATT&CK DB: ${cov.unmapped.join(", ")}.` : "");
}

async function load() {
  try {
    const d = await getJSON("attack.json");
    document.getElementById("updated").textContent = "updated " + fmtTime(d.updated);
    DATA = d;
    tiles(d); timeline(d); if (!EMBED) stories(d);
    if (OPEN) openCat(OPEN, PICK);
  } catch (e) { document.getElementById("updated").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  if (!EMBED) {
    try { coverage(await getJSON("attack-coverage.json")); }
    catch (e) { document.getElementById("matrix").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  }
}
const Q = new URLSearchParams(location.search);
load().then(() => { if (Q.get("cat")) openCat(Q.get("cat"), Q.get("story")); });
setInterval(load, 10 * 60 * 1000);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DATA && timeline(DATA), 300); });
</script>
